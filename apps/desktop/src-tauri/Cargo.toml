[package]
name = "talos-desktop"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"

# Standalone Tauri workspace (path-deps into ../../crates).
[workspace]

[lib]
name = "talos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Explicit opt-in for real OS control. NEVER enabled in CI or default builds.
# Forwards through tool_runtime to computer_use/real-os-control. Local runs
# additionally require TALOS_COMPUTER_REAL=1 plus an enabled envelope and
# policy Allow verdicts.
real-os-control = ["tool_runtime/real-os-control", "computer_use/real-os-control"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
talos_updates = { path = "../../../crates/talos_updates" }
time = { version = "0.3", features = ["formatting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["full"] }
talos_common = { path = "../../../crates/talos_common" }
policy_broker = { path = "../../../crates/policy_broker" }
evidence_store = { path = "../../../crates/evidence_store" }
agent_runtime = { path = "../../../crates/agent_runtime" }
tool_runtime = { path = "../../../crates/tool_runtime" }
sandbox = { path = "../../../crates/sandbox" }
computer_use = { path = "../../../crates/computer_use" }
remote_runner = { path = "../../../crates/remote_runner" }
context_budget = { path = "../../../crates/context_budget" }
tool_rag = { path = "../../../crates/tool_rag" }
llm_gateway = { path = "../../../crates/llm_gateway" }
talos_secrets = { path = "../../../crates/talos_secrets" }
talos_telemetry = { path = "../../../crates/talos_telemetry" }
cost_tracker = { path = "../../../crates/cost_tracker" }
context_assembler = { path = "../../../crates/context_assembler" }
workspace_manager = { path = "../../../crates/workspace_manager" }
embedding_engine = { path = "../../../crates/embedding_engine" }
vector_store = { path = "../../../crates/vector_store" }
memory_indexer = { path = "../../../crates/memory_indexer" }
skill_extractor = { path = "../../../crates/skill_extractor" }
mcp_client = { path = "../../../crates/mcp_client" }
mcp_server = { path = "../../../crates/mcp_server" }
instruction_parser = { path = "../../../crates/instruction_parser" }
browser_use = { path = "../../../crates/browser_use" }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
tokio-tungstenite = "0.26"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
