name: Bug report
description: Report a reproducible defect with evidence.
title: "fix: <short summary>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Attach evidence — exact commands + verbatim output + commit SHA. Do not paste secrets.
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Tag or short SHA (e.g. v0.1.0-green-baseline or output of git rev-parse --short HEAD).
      placeholder: v0.1.0-green-baseline
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - ui
        - desktop (tauri shell)
        - rust (policy/evidence/runtime)
        - contracts
        - audit swarm
        - ci
        - media/brand
        - docs
      default: 0
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Exact commands from a clean state.
      placeholder: |
        1. pnpm install
        2. pnpm test
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior + verbatim output
      description: Paste key output lines verbatim. Attach docs/reports/audit-latest.md when relevant.
      render: shell
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        OS:
        node --version:
        pnpm --version:
        cargo --version / rustc --version:
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: I searched existing issues and did not find a duplicate.
        - label: I attached evidence (no secrets or absolute local paths beyond the repo root).
