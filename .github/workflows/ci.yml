name: ci

on:
  push:
    branches: [main]
    # Docs-only pushes skip per-push CI (minutes are free, but the signal is
    # noise-free without them); PRs always run the full matrix so docs-only
    # PRs stay mergeable under the main branch ruleset.
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly extra coverage beyond per-push CI (public minutes are free).
    - cron: "0 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: every job gets read-only repo content.
# Jobs that upload artifacts declare their own `actions: write` below.
permissions:
  contents: read

jobs:
  meta:
    name: setup / meta
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Required enterprise files exist
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f CHANGELOG.md
          test -f SUPPORT.md
          test -f .github/CODEOWNERS
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/ISSUE_TEMPLATE/bug_report.yml
          test -f .github/ISSUE_TEMPLATE/feature_request.yml
          test -f .github/ISSUE_TEMPLATE/security_report.yml
          test -f .github/ISSUE_TEMPLATE/question.yml
          test -f .github/ISSUE_TEMPLATE/config.yml
          test -f docs/media/talos-logo.svg
          test -f docs/media/talos-banner.svg
          test -f docs/media/hero.gif
          test -f docs/media/evidence.gif
          test -f docs/media/architecture.svg
          test -f scripts/media/generate-brand.mjs
          echo "meta: enterprise storefront files present"
      - name: Toolchain pins
        run: |
          cat .nvmrc
          node --version || true
          node -p "require('./package.json').packageManager"

  typescript:
    name: typescript (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build workspace types first (lint is type-aware)
        run: pnpm --filter @talos/contracts build && pnpm --filter @talos/browser-use build
      - name: Lint (prettier + workspace lints)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  rust-core:
    name: rust-core (fmt / clippy / test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
      - name: Install bubblewrap (Linux sandbox backend for escape tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Format check (crates)
        run: cargo fmt --all -- --check
        working-directory: crates
      - name: Format check (crates)
        run: cargo fmt --all -- --check
        working-directory: crates
      - name: Clippy, deny warnings (crates)
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: crates
      - name: Tests (crates workspace)
        run: cargo test --workspace
        working-directory: crates

  desktop-check:
    name: desktop-check (tauri shell compiles)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
            crates -> target
      - name: Tauri Linux prerequisites (WebKit2GTK, build tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev
      - name: Format check (desktop shell)
        run: cargo fmt --all -- --check
        working-directory: apps/desktop/src-tauri
      - name: Clippy, deny warnings (desktop shell)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - name: Compile check (no bundle)
        run: cargo check --all-targets
        working-directory: apps/desktop/src-tauri
      # NOTE: the full Tauri desktop bundle (`pnpm build:desktop`) is intentionally
      # NOT built here: it needs platform bundler toolchains (NSIS/WiX on Windows,
      # appimagetool on Linux), signing identity, and a display for smoke tests.
      # Compilation of the shell is covered by the check step above; run
      # `pnpm build:desktop` locally for the installer artifact.

  audit:
    name: audit (dep audit + swarm)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write # uploads talos-audit-reports + talos-audit-baselines
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Install just (swarm toolchain probe)
        # Resilient installer (issue #34: just.systems returned curl 403 on
        # run 43444958746): bounded retry with backoff, then fallback to a
        # pinned crates.io build on the same trust path as the toolchain
        # install. No unbounded retries. `just` is a presence probe only
        # (reliability agent runs `just --version`), so installer-latest vs
        # pinned-fallback drift is harmless; the fallback version is pinned.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl --proto '=https' --tlsv1.2 -LsSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "installer unreachable after 3 attempts; falling back to cargo install just"
              cargo install just --version 1.59.0 --locked
            else
              echo "just installer attempt $attempt/3 failed; backing off"
              sleep $((attempt * 15))
            fi
          done
          just --version
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (dist required for perf baselines)
        run: pnpm build
      - name: Dependency audit (high+)
        run: pnpm audit --audit-level high
      - name: 11-agent audit swarm
        run: pnpm audit:swarm
      - name: Baseline summary (from swarm JSON)
        if: always()
        run: |
          node -e "
            const r = require('./docs/reports/audit-latest.json');
            console.log('status: ' + r.status);
            for (const [k, v] of Object.entries(r.metrics ?? {})) console.log('metric ' + k + '=' + v);
            const fails = (r.agents ?? []).flatMap(a => (a.findings ?? []).filter(f => f.check === 'baseline-regression' && f.severity === 'critical'));
            if (fails.length > 0) { console.error('BASELINE FAILURES:'); for (const f of fails) console.error('- ' + f.message); process.exit(1); }
            console.log('baselines: no critical regressions');
          "
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: talos-audit-reports
          path: docs/reports/
          retention-days: 14
          if-no-files-found: error
      - name: Upload audit baselines
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: talos-audit-baselines
          path: .talos/baselines.json
          retention-days: 14
          if-no-files-found: warn

  parity:
    name: parity (matrix + charter gate)
    # Depends on nothing but the checkout: schema, evidence paths,
    # deterministic SUMMARY.md, competitor-cell lockdown, Apache-2.0
    # manifests, talos.dev sweep, reports ledger, FLAKES register.
    # Drift or an invented competitor cell FAILS here (and in the swarm).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Validate parity matrix + charter
        run: node scripts/parity/validate-matrix.mjs --check

  perf:
    name: perf (P3 harness budgets)
    # Deterministic P3 gate: seeded mock-data harness, no display
    # dependency. Budgets live in .talos/baselines.json (WARN on breach,
    # FAIL on critical); the swarm's PerformanceAgent independently
    # evaluates the committed harness sample in the `audit` job.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build UI dist (harness records real bundle bytes)
        run: |
          pnpm --filter @talos/contracts build && pnpm --filter @talos/browser-use build
          pnpm --filter ui build
      - name: P3 harness, 20 runs, budget check
        run: node scripts/perf-harness.mjs --runs 20 --check

  awakening:
    name: awakening (proof-of-awakening demo)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write # uploads talos-awakening-report
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build workspace types first (UI tests resolve dist)
        run: pnpm --filter @talos/contracts build && pnpm --filter @talos/browser-use build
      - name: Proof of Awakening (full-mock)
        run: pnpm demo:awakening
      - name: Upload demo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: talos-awakening-report
          path: docs/evidence/batch3-demo-report.json
          retention-days: 14
          if-no-files-found: error

  hardening:
    name: hardening (proof-of-hardening demo)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write # uploads talos-hardening-report
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
      - name: Install bubblewrap (Linux sandbox backend for live enforcement)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build workspace types first (UI tests resolve dist)
        run: pnpm --filter @talos/contracts build && pnpm --filter @talos/browser-use build
      - name: Proof of Hardening (full-mock + sandbox-live)
        run: node tools/demo/hardening.mjs --sandbox-live
      - name: Upload demo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: talos-hardening-report
          path: docs/evidence/batch4-demo-report.json
          retention-days: 14
          if-no-files-found: error

  media-check:
    name: media-check (assets + README refs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Required media assets exist
        run: |
          set -euo pipefail
          test -f docs/media/talos-logo.svg
          test -f docs/media/talos-banner.svg
          test -f docs/media/hero.gif
          test -f docs/media/evidence.gif
          test -f docs/media/architecture.svg
          test -f scripts/media/generate-brand.mjs
          echo "media assets present"
      - name: README references resolve to local files
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const md = fs.readFileSync('README.md', 'utf8');
            const refs = [...md.matchAll(/\\((docs\\/media\\/[A-Za-z0-9._-]+)\\)/g)].map(m => m[1]);
            if (refs.length === 0) { console.error('no docs/media refs in README'); process.exit(1); }
            for (const r of refs) {
              if (!fs.existsSync(r)) { console.error('missing README ref: ' + r); process.exit(1); }
              console.log('ok: ' + r);
            }
          "
      - name: GIFs are valid GIF89a
        run: |
          node -e "
            const fs = require('fs');
            for (const f of ['docs/media/hero.gif', 'docs/media/evidence.gif']) {
              const b = fs.readFileSync(f);
              if (b.subarray(0, 6).toString() !== 'GIF89a') { console.error('bad header: ' + f); process.exit(1); }
              if (b.length < 1024) { console.error('suspiciously small: ' + f); process.exit(1); }
              console.log('ok: ' + f + ' ' + b.length + ' bytes');
            }
          "
      - name: Brand regeneration is deterministic (no diff)
        run: |
          node scripts/media/generate-brand.mjs
          git status --porcelain -- docs/media scripts/media
          test -z "$(git status --porcelain -- docs/media scripts/media)"

  browser-live-smoke:
    name: browser live smoke (manual only)
    # Manual-only: installs real Chromium and runs ONE live navigation.
    # Never runs on push/PR/schedule; the default matrix stays mock-only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build browser worker
        run: pnpm --filter @talos/browser-use run build
      - name: Install Chromium for Playwright
        run: pnpm --filter @talos/browser-use exec playwright install --with-deps chromium
      - name: Live navigate to example.com and verify receipt
        run: |
          set -euo pipefail
          TALOS_BROWSER_LIVE=1 node packages/browser-use/dist/worker.js \
            '{"action":"snapshot_dom","url":"https://example.com","taskId":"ci-smoke"}' \
            > /tmp/talos-smoke.json
          cat /tmp/talos-smoke.json
          node -e "
            const fs = require('fs');
            const receipt = JSON.parse(fs.readFileSync('/tmp/talos-smoke.json', 'utf8'));
            if (receipt.status !== 'success') { throw new Error('live smoke failed: ' + JSON.stringify(receipt.error ?? receipt)); }
            if (receipt.simulated !== false) { throw new Error('expected a real (non-simulated) receipt'); }
            if (!/^sha256:/.test(receipt.domHash ?? '')) { throw new Error('missing domHash'); }
            console.log('live smoke ok: ' + receipt.domHash);
          "

  stress-shutdown:
    name: deterministic pool-shutdown stress (all OSes)
    # Regression net for the `connection pool did not drain` flake: the
    # environments that flaked must run the 100-cycle seal stress every push.
    # Rust is pinned to rust-toolchain.toml (1.99.1) via the action input.
    # NOTE: macOS is intentionally absent — `macos-latest` jobs never dispatch
    # for this repo (queued with 0 steps, then cancelled, on consecutive runs
    # 43244583821 attempts 1–2); ubuntu + windows cover the flaked environments
    # (CI-linux + Windows dev). Re-add macos when runner capacity exists.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
      - name: Resolve pinned toolchain
        run: rustc --version
        working-directory: crates
      - name: Pool shutdown stress + historically flaky seal tests
        run: |
          cargo test -p evidence_store --lib -- db::tests::encrypted_reopen_preserves_data db::tests::plaintext_database_migrates_in_place db::tests::orphan_work_file_is_adopted_not_deleted
          cargo test -p evidence_store --lib -- --ignored db::tests::pool_shutdown_survives_repeated_seal_cycles
        working-directory: crates

  flake-watch:
    name: flake policy reminder (non-blocking)
    # Policy wiring (docs/CI.md): at most ONE rerun per run; a rerun that goes
    # green must produce a tracked flake issue + quarantine entry. This job
    # only reminds — it never fails, so it cannot block merges.
    if: always()
    needs:
      [
        meta,
        typescript,
        rust-core,
        desktop-check,
        audit,
        awakening,
        hardening,
        media-check,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rerun accounting
        run: |
          echo "run_attempt=${{ github.run_attempt }}"
          if [ "${{ github.run_attempt }}" -gt 1 ]; then
            {
              echo "## Flake policy reminder"
              echo ""
              echo "This run is attempt ${{ github.run_attempt }} (a rerun)."
              echo "Repo policy (docs/CI.md): at most ONE rerun per run; if this goes"
              echo "green on rerun, open or append a tracked flake issue with the run"
              echo "URL, attempt number, and failing test id, and add it to the"
              echo "quarantine register (docs/evidence/FLAKES.md). No silent reruns."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "first attempt: no rerun accounting needed"
          fi
