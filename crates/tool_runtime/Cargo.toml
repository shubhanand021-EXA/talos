[package]
name = "tool_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Explicit opt-in for real OS control. NEVER enabled in CI or default builds.
# Forwards to computer_use/real-os-control: accessibility drivers, OS input,
# and the screenshot/vision loop. Local runs additionally require
# TALOS_COMPUTER_REAL=1 plus an enabled envelope and policy Allow verdicts.
real-os-control = ["computer_use/real-os-control"]

[lints]
workspace = true

[dependencies]
talos_common = { path = "../talos_common" }
talos_telemetry = { path = "../talos_telemetry" }
policy_broker = { path = "../policy_broker" }
evidence_store = { path = "../evidence_store" }
computer_use = { path = "../computer_use" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

