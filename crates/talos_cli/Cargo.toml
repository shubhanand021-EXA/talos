[package]
name = "talos_cli"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
description = "Talos headless CLI: scriptable task execution over the shared policy broker and evidence ledger"

[[bin]]
name = "talos"
path = "src/main.rs"

[lib]
name = "talos_cli"
path = "src/lib.rs"

[dependencies]
talos_common = { path = "../talos_common" }
policy_broker = { path = "../policy_broker" }
evidence_store = { path = "../evidence_store" }
talos_secrets = { path = "../talos_secrets" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
