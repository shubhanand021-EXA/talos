[features]
# Reserved gate for real OS control. Enabling it fails the build on purpose:
# no active keyboard/mouse control is implemented, and none may land without
# an explicit human-approval path plus policy gate (see ADR 0003).
real-os-control = []

[dependencies]
talos_common = { path = "../talos_common" }
